<h1>Departamentos</h1>
<div class="container">
    @for (dept of departamentos; track dept.numero) {
        <div class="card mb-3">
            <div class="card-body">
                <h3>{{dept.nombre}}</h3>
                <p>Número: {{dept.numero}}</p>
                <p>Localidad: {{dept.localidad}}</p>
                <a [routerLink]="['/details', dept.numero]">
                    Ver detalles
                </a>
            </div>
        </div>
    }
</div>
